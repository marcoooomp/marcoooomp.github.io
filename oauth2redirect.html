<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Answr — volviendo a la app</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d0d12; color: #f4f4f6;
    text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: light) {
    body { background: #fbfbfd; color: #16161a; }
    .sub { color: #5b5b66; }
    .code { background: #eeeef3; }
  }
  .wrap { max-width: 30rem; }
  h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 .6rem; letter-spacing: -.02em; }
  .sub { color: #a0a0ad; line-height: 1.55; margin: 0 0 1.4rem; font-size: .95rem; }
  .code {
    display: inline-block; background: #1c1c24; border-radius: 10px;
    padding: .7rem 1rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .8rem; word-break: break-all; max-width: 100%;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Ya puedes volver a Answr</h1>
    <p class="sub">
      Si la app no se ha abierto sola, ciérrala y vuelve a abrirla desde el
      icono de Answr.
    </p>
    <div class="code" id="code" hidden></div>
  </div>

<script>
// This page is a safety net, not the happy path.
//
// answr.lol/oauth2redirect is registered as an Android App Link, so when
// verification has succeeded Android hands the redirect straight to Answr and
// this HTML is never rendered. Landing here means one of three things: the app
// is not installed, Play has not finished verifying the link yet, or the user
// opened the URL on a desktop browser.
//
// In the first two cases the app IS on the device and still listens on its own
// com.replyflow.app scheme, so bouncing to it recovers the sign-in instead of
// stranding the creator on a dead page. The bounce is silent when it fails —
// an unhandled custom scheme just does nothing.
(function () {
  var qs = window.location.search || '';
  if (!qs) return;

  try {
    window.location.replace('com.replyflow.app:/oauth2redirect' + qs);
  } catch (e) { /* scheme not handled — the message above stands */ }

  // Show the raw callback only if the bounce clearly did not take, so a stuck
  // user has something concrete to report rather than a blank screen.
  setTimeout(function () {
    var el = document.getElementById('code');
    if (!el) return;
    el.textContent = qs.replace(/^\?/, '');
    el.hidden = false;
  }, 2500);
})();
</script>
</body>
</html>
